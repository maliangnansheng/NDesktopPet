name: Build desktop app

# 打三平台安装包。
#   手动跑：Actions 页面 → 选这个 workflow → Run workflow
#   发版本：git tag v1.0.0 && git push --tags  → 会自动建 Release 并挂上安装包
#
# 为什么要在 GitHub 上打？
#   macOS 的 dmg 只能在 macOS 上生成，Linux 的 AppImage 要能建符号链接 ——
#   这两件事 Windows 都做不了。三个 runner 各用原生系统，各自打包最省事。

on:
  workflow_dispatch:
  push:
    branches:
      - main          # 推到 main 先跑一遍验证（失败也不影响发版）
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 注意 --publish=never：
      #   electron-builder 只要检测到 CI 环境变量，就会把发布策略默认成 auto，
      #   打完包立刻去 GitHub Releases 上传，找不到 token 就整步报错
      #   （"GitHub Personal Access Token is not set"）—— 包其实已经打好了，
      #   只是被这一步带崩。发版统一交给下面 release job 用 gh release create，
      #   所以这里明确关掉。
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: NDesktopPet-windows-x64
            run: npm run build:win -- --publish=never
            files: dist/*.exe
          - os: macos-latest
            label: macOS
            artifact: NDesktopPet-macos
            # 同一个 job 里分别出 Apple Silicon 与 Intel 两版
            run: npm run build:mac -- --arm64 --publish=never && npm run build:mac -- --x64 --publish=never
            files: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            label: Linux x64
            artifact: NDesktopPet-linux-x64
            run: npm run build:linux -- --publish=never
            files: |
              dist/*.AppImage
              dist/*.tar.gz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 三平台统一用 bash + tee：日志既能实时输出，也能存一份给下面的诊断步骤用
      # （Windows runner 默认是 pwsh，显式指定 bash 走 Git Bash）
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.run }} 2>&1 | tee build.log
        env:
          # 没有 Apple 开发者证书时不要去探测签名身份，省得卡住
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 失败时把日志尾部塞进 annotation —— annotation 是公开放的，
      # 不用登录网页、不用下载日志包也能在 Actions 摘要里直接看到原因
      - name: Diagnose failure
        if: failure()
        shell: bash
        run: |
          echo "node $(node -v) / npm $(npm -v) / $(uname -a)"
          if [ ! -f build.log ]; then echo "没有 build.log"; exit 0; fi
          echo "---- 日志尾部 ----"
          tail -n 60 build.log
          msg=$(tail -n 45 build.log | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')
          echo "::error title=${{ matrix.label }} 构建失败（日志尾部）::$msg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    # 只有推 v* tag 才发版：git tag v1.0.0 && git push --tags
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 产物路径按 0 分隔读进数组：直接 $(find ...) 遇到带空格的名字会被拆成
          # 多个参数，gh 会报「文件不存在」
          mapfile -t files < <(find artifacts -type f | sort)
          printf '%s\n' "${files[@]}"
          # 有手写说明就用它（.github/release-notes/<tag>.md），没有则按 commit 自动生成
          notes=".github/release-notes/${TAG}.md"
          title="NDesktopPet ${TAG}"
          # 允许重跑同一个 tag：已存在就只改说明 + 覆盖同名产物（--clobber），
          # 否则重打一次包就会因为「release 已存在」整个 job 挂掉
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "$title" --notes-file "$notes"
            else
              gh release edit "$TAG" --title "$title"
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "$title" --notes-file "$notes" "${files[@]}"
          else
            gh release create "$TAG" --title "$title" --generate-notes "${files[@]}"
          fi
